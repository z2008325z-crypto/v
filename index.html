<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>يحب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora"><span></span><span></span><span></span></div>
  <div id="toast" class="toast"></div>

  <!-- شاشة الدخول -->
  <section id="auth-screen" class="screen hidden">
    <div class="auth-wrap glass fade-in">
      <h1 class="logo">يحب</h1>
      <p class="tagline">مساحة صغيرة لكل الكلام</p>

      <div class="switch">
        <button type="button" id="tab-login" class="switch-btn active">دخول</button>
        <button type="button" id="tab-signup" class="switch-btn">حساب جديد</button>
      </div>

      <form id="auth-form" autocomplete="on">
        <input id="auth-name" class="field hidden" placeholder="الاسم" maxlength="30">
        <input id="auth-email" type="email" class="field" placeholder="البريد الإلكتروني" required>
        <input id="auth-pass" type="password" class="field" placeholder="كلمة السر" minlength="6" required>
        <button class="btn shine primary full" id="auth-submit" type="submit">دخول</button>
      </form>

      <div class="divider"><span>أو</span></div>
      <button class="btn shine full" id="google-btn" type="button">الدخول بحساب Google</button>
      <p id="auth-error" class="error"></p>
    </div>
  </section>

  <!-- التطبيق -->
  <section id="app-screen" class="screen hidden">
    <header class="topbar glass">
      <span class="logo small">يحب</span>
      <nav class="tabs">
        <button class="btn tab active" data-tab="feed">الرئيسية</button>
        <button class="btn tab" data-tab="profile">حسابي</button>
        <button class="btn tab admin-only hidden" data-tab="admin">الأدمن</button>
      </nav>
      <button class="btn shine ghost" id="logout-btn" type="button">خروج</button>
    </header>

    <main>
      <!-- الرئيسية -->
      <div id="tab-feed" class="page">
        <div class="glass card composer">
          <textarea id="post-text" placeholder="ماذا يحدث؟" maxlength="500"></textarea>
          <input id="post-image" class="field" placeholder="رابط صورة (اختياري) https://...">
          <div class="row-end">
            <span class="counter" id="counter">0/500</span>
            <button class="btn shine primary" id="post-btn" type="button">نشر</button>
          </div>
        </div>
        <div id="feed"></div>
      </div>

      <!-- الملف الشخصي -->
      <div id="tab-profile" class="page hidden">
        <div class="glass card" id="profile-card"></div>
        <div class="glass card">
          <h3>تعديل الاسم</h3>
          <input id="edit-name" class="field" maxlength="30">
          <button class="btn shine primary" id="save-name" type="button">حفظ</button>
        </div>
      </div>

      <!-- الأدمن -->
      <div id="tab-admin" class="page hidden">
        <div class="glass card">
          <h3>هوية الموقع</h3>
          <div class="color-row">
            <label>لون الخلفية<input type="color" id="set-bg" value="#000000"></label>
            <label>لون التمييز<input type="color" id="set-accent" value="#4f8cff"></label>
          </div>
          <button class="btn shine primary" id="save-settings" type="button">حفظ الألوان</button>
        </div>

        <div class="glass card">
          <h3>المستخدمون والتوثيق</h3>
          <input id="user-search" class="field" placeholder="ابحث بالاسم أو الإيميل">
          <div id="users-list"></div>
        </div>

        <div class="glass card">
          <h3>المهام</h3>
          <form id="task-form" class="inline-form">
            <input id="task-input" class="field" placeholder="مهمة جديدة" maxlength="120">
            <button class="btn shine primary" type="submit">إضافة</button>
          </form>
          <div id="tasks-list"></div>
        </div>
      </div>
    </main>
  </section>

  <script type="module" src="script.js"></script>
</body>
</html>
